name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -s sh -S warning statusline-command.sh usage-fetch.sh ideogram-ledger ideogram-hook.sh install.sh
      - name: statusline tests
        run: bash test/statusline.test.sh
      - name: usage-fetch tests
        run: bash test/usage-fetch.test.sh
      - name: ideogram-ledger tests
        run: bash test/ideogram-ledger.test.sh
      - name: install tests
        run: bash test/install.test.sh
